<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login Dashboard</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        background: linear-gradient(to right, #4facfe, #00f2fe);
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
    }

    .container{
        width:380px;
        background:white;
        padding:25px;
        border-radius:12px;
        box-shadow:0 5px 15px rgba(0,0,0,0.2);
    }

    h2{
        text-align:center;
        margin-bottom:20px;
        color:#333;
    }

    input{
        width:100%;
        padding:10px;
        margin:8px 0;
        border:1px solid #ccc;
        border-radius:6px;
    }

    button{
        width:100%;
        padding:10px;
        border:none;
        background:#007bff;
        color:white;
        border-radius:6px;
        margin-top:10px;
        cursor:pointer;
        font-size:16px;
    }

    button:hover{
        background:#0056b3;
    }

    .hidden{
        display:none;
    }

    .dashboard{
        text-align:center;
    }

    .dashboard img{
        width:120px;
        height:120px;
        border-radius:50%;
        object-fit:cover;
        border:4px solid #007bff;
        margin-bottom:15px;
    }

    .info{
        text-align:left;
        margin-top:15px;
    }

    .info p{
        margin:10px 0;
        font-size:15px;
    }

    .logout-btn{
        background:red;
    }

    .logout-btn:hover{
        background:darkred;
    }
</style>
</head>
<body>

<!-- Registration Form -->
<div class="container" id="registerContainer">
    <h2>Registration Form</h2>

    <input type="file" id="photo" accept="image/*">

    <input type="text" id="username" placeholder="Create Username">
    <input type="password" id="password" placeholder="Create Password">

    <button onclick="register()">Register</button>
</div>

<!-- Login Form -->
<div class="container hidden" id="loginContainer">
    <h2>Login Form</h2>

    <input type="text" id="loginUsername" placeholder="Username">
    <input type="password" id="loginPassword" placeholder="Password">

    <button onclick="login()">Login</button>
</div>

<!-- Dashboard -->
<div class="container hidden dashboard" id="dashboardContainer">
    <h2>Student Dashboard</h2>

    <img id="DS05968.jpg" src="DSC05968.jpg" width="120" height="120" style:"border-radius: 50%; object-fit: cover;">

    <div class="info">
        <p><strong>Name:</strong> Acipar Drapiza</p>
        <p><strong>Email:</strong> acipardrapiza@gmail.com</p>
        <p><strong>Course:</strong> Bachelor of Science in Information System</p>
        <p><strong>University:</strong> JRMSU Siocon Campus</p>
        <p><strong>Address:</strong> Pangian, Siocon, Zamboanga del Norte</p>
    </div>

    <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<script>

let savedUsername = "";
let savedPassword = "";
let savedPhoto = "";

function register(){

    savedUsername = document.getElementById("username").value;
    savedPassword = document.getElementById("password").value;

    const photoInput = document.getElementById("photo");

    if(savedUsername === "" || savedPassword === ""){
        alert("Please complete all fields.");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

        savedPhoto = e.target.result;

        alert("Registration Successful!");

        document.getElementById("registerContainer").classList.add("hidden");
        document.getElementById("loginContainer").classList.remove("hidden");
    }

    if(photoInput.files[0]){
        reader.readAsDataURL(photoInput.files[0]);
    } else {

        savedPhoto = "https://via.placeholder.com/120";

        alert("Registration Successful!");

        document.getElementById("registerContainer").classList.add("hidden");
        document.getElementById("loginContainer").classList.remove("hidden");
    }
}

function login(){

    const loginUser = document.getElementById("loginUsername").value;
    const loginPass = document.getElementById("loginPassword").value;

    if(loginUser === savedUsername && loginPass === savedPassword){

        document.getElementById("loginContainer").classList.add("hidden");
        document.getElementById("dashboardContainer").classList.remove("hidden");

        document.getElementById("displayPhoto").src = savedPhoto;

    } else {

        alert("Incorrect Username or Password!");
    }
}

function logout(){

    document.getElementById("dashboardContainer").classList.add("hidden");
    document.getElementById("loginContainer").classList.remove("hidden");

    document.getElementById("loginUsername").value = "";
    document.getElementById("loginPassword").value = "";
}

</script>

</body>
</html>
